backend:
  name: git-gateway
  branch: draft

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Show TOC"
        name: "toc"
        widget: "boolean"
        default: true
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "Frontend"
          - "Backend"
          - "Project Notes"
          - "Code Debugging"
          - "Performance"
          - "Architecture"
          - "Tools & Workflows"
          - "Books & Reading"
          - "Career & Mindset"
          - "嘀嘀嗒嗒"
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - C#
          - .NET
          - ASP.NET
          - Entity Framework
          - LINQ
          - Authentication
          - Authorization
          - JavaScript
          - TypeScript
          - Node.js
          - React
          - Redux
          - Next.js
          - Tailwind CSS
          - SQL Server
          - T-SQL
          - Query Optimization
          - REST API
          - Visual Studio
          - VS Code
          - Debugging
          - Performance Tuning
          - System Design
          - Code Refactoring
          - Clean Architecture
          - Scalability
          - Real-Time Systems
          - Event-Driven Architecture
          - 杂感
      - { label: "Body", name: "body", widget: "markdown" }