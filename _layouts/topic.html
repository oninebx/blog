---
layout: archive
---


<p>{{ page.topic.description }}</p>

{% assign posts = site.posts | where: "topic", page.topic.id %}
<ul>
{% for post in posts %}
  <li>
    <a href="{{ post.url }}">{{ post.title }}</a>
    <span>{{ post.date | date: "%Y-%m-%d" }}</span>
  </li>
{% endfor %}
</ul>

{% if posts == empty %}
  <p>There is no article in this topic.</p>
{% endif %}
